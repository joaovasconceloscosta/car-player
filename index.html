<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>Car Player</title>
  <!-- YouTube IFrame API loaded on demand -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #e8b400;
      --bg: #0a0a0a;
      --surface: #161616;
      --surface2: #222;
      --text: #f0f0f0;
      --muted: #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── HOME SCREEN ── */
    #home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      height: 100dvh;
      padding: 32px;
    }

    #home h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #home h1 span { color: var(--accent); }

    .url-row {
      display: flex;
      width: 100%;
      max-width: 640px;
      gap: 10px;
    }

    #urlInput {
      flex: 1;
      padding: 16px 18px;
      font-size: 1rem;
      border-radius: 12px;
      border: 2px solid var(--surface2);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    #urlInput:focus { border-color: var(--accent); }
    #urlInput::placeholder { color: var(--muted); }

    .btn {
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:active { opacity: 0.75; transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--surface2); color: var(--text); }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 640px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--surface2);
    }

    #fileInput { display: none; }

    .file-btn {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .status-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 16px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 5px;
    }

    .status-dot.active { background: #4caf50; }

    /* ── PLAYER SCREEN ── */
    #player-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    #vid {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Overlay controls */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.3s;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.55) 0%,
        transparent 25%,
        transparent 70%,
        rgba(0,0,0,0.7) 100%);
    }

    #overlay.visible { opacity: 1; }

    #overlay-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px 0;
    }

    #overlay-top button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #overlay-title {
      flex: 1;
      font-size: 0.9rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px #000;
    }

    #overlay-bottom {
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Progress bar */
    #progress-wrap {
      position: relative;
      height: 5px;
      border-radius: 5px;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      touch-action: none;
    }

    #progress-fill {
      height: 100%;
      border-radius: 5px;
      background: var(--accent);
      pointer-events: none;
      width: 0%;
    }

    #progress-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      left: 0%;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .ctrl-btn:active { background: rgba(255,255,255,0.15); }

    .ctrl-btn svg { width: 28px; height: 28px; }

    #playBtn svg { width: 38px; height: 38px; }

    #timeDisplay {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.85);
      margin-left: auto;
      letter-spacing: 0.3px;
    }

    /* Volume slider */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 5px;
      border-radius: 5px;
      background: rgba(255,255,255,0.3);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* Tap zones for skip */
    #tap-back, #tap-fwd {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tap-back { left: 0; }
    #tap-fwd { right: 0; }

    .tap-hint {
      pointer-events: none;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }

    /* Resume badge */
    #resume-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75);
      border-radius: 12px;
      padding: 18px 28px;
      text-align: center;
      display: none;
      z-index: 20;
    }

    #resume-badge p { margin-bottom: 12px; font-size: 1rem; }

    #resume-badge .btn { font-size: 0.9rem; padding: 12px 22px; }

    /* YouTube container */
    #yt-wrap {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #yt-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* In YouTube mode, hide HTML5-only controls */
    .player-screen--youtube #tap-back,
    .player-screen--youtube #tap-fwd,
    .player-screen--youtube #overlay-bottom { display: none; }

    .player-screen--youtube #overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 30%);
      pointer-events: none;
    }

    .player-screen--youtube #overlay-top {
      pointer-events: all;
    }

    /* Error message */
    #error-msg {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      z-index: 50;
    }
  </style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <h1>Car <span>Player</span></h1>

  <div class="url-row">
    <input id="urlInput" type="url" inputmode="url" placeholder="URL do vídeo ou YouTube" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-primary" onclick="playUrl()">Play</button>
  </div>

  <div class="divider">ou</div>

  <label class="file-btn">
    <input id="fileInput" type="file" accept="video/*" onchange="playFile(this)">
    <span class="btn btn-secondary" style="display:inline-block;width:100%;max-width:640px">
      Abrir ficheiro do dispositivo
    </span>
  </label>

  <div class="status-bar">
    <span id="wakeStatus"><span class="status-dot" id="wakeDot"></span>Wake Lock</span>
    <span id="resumeStatus"><span class="status-dot active"></span>Auto-retoma</span>
  </div>
</div>

<!-- PLAYER -->
<div id="player-screen">
  <video id="vid" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
  <div id="yt-wrap"></div>

  <!-- Tap zones (skip) -->
  <div id="tap-back" ontouchend="skipBack(event)">
    <div class="tap-hint">−10s</div>
  </div>
  <div id="tap-fwd" ontouchend="skipFwd(event)">
    <div class="tap-hint">+10s</div>
  </div>

  <!-- Error message -->
  <div id="error-msg"></div>

  <!-- Resume badge -->
  <div id="resume-badge">
    <p>Vídeo pausado</p>
    <button class="btn btn-primary" onclick="manualResume()">▶ Retomar</button>
  </div>

  <!-- Controls overlay -->
  <div id="overlay">
    <div id="overlay-top">
      <button onclick="goHome()" title="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span id="overlay-title"></span>
      <button onclick="toggleFullscreen()" title="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
    </div>

    <div id="overlay-bottom">
      <div id="progress-wrap">
        <div id="progress-fill"></div>
        <div id="progress-thumb"></div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" onclick="skipBack()" title="-10s">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15" font-size="5" text-anchor="middle" fill="currentColor">10</text></svg>
        </button>

        <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="ctrl-btn" onclick="skipFwd()" title="+10s">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15" font-size="5" text-anchor="middle" fill="currentColor">10</text></svg>
        </button>

        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>

        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">

        <span id="timeDisplay">0:00 / 0:00</span>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const vid = document.getElementById('vid');
const playerScreen = document.getElementById('player-screen');
let overlayTimer = null;
let wakeLock = null;
let userPaused = false;
let resumeBadgeShown = false;
let seeking = false;
let objectUrl = null;

// YouTube state
let currentMode = 'video'; // 'video' | 'youtube'
let ytPlayer = null;
let ytApiLoaded = false;
let ytApiReady = false;
let ytPending = null; // { id, title } waiting for API

// HLS state
let hlsInstance = null;
let hlsJsLoaded = false;

// ── Wake Lock ──────────────────────────────────────────────────────────────
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    document.getElementById('wakeDot').classList.add('active');
    wakeLock.addEventListener('release', () => {
      document.getElementById('wakeDot').classList.remove('active');
    });
  } catch (e) {}
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock === null) {
    await acquireWakeLock();
  }
});

acquireWakeLock();

// ── HLS / M3U8 support ────────────────────────────────────────────────────
function isHlsUrl(url) {
  return /\.m3u8(\?|$)/i.test(url);
}

function destroyHls() {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
}

function loadHlsJs(cb) {
  if (window.Hls) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
  s.onload = cb;
  document.head.appendChild(s);
  hlsJsLoaded = true;
}

function attachHls(src) {
  destroyHls();
  if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    // Native HLS (Safari/WebKit — most car browsers)
    vid.src = src;
    vid.play().catch(() => {});
  } else {
    loadHlsJs(() => {
      if (!Hls.isSupported()) { showError('HLS não suportado neste browser'); return; }
      hlsInstance = new Hls({ enableWorker: false });
      hlsInstance.loadSource(src);
      hlsInstance.attachMedia(vid);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
      hlsInstance.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) showError('Erro ao carregar stream HLS');
      });
    });
  }
}

// ── YouTube URL detection ──────────────────────────────────────────────────
function extractYoutubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com')) {
      if (u.pathname === '/watch') return u.searchParams.get('v');
      const m = u.pathname.match(/\/(?:shorts|embed)\/([^/?&#]+)/);
      if (m) return m[1];
    }
    if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
  } catch(e) {}
  return null;
}

// ── YouTube IFrame API ─────────────────────────────────────────────────────
function loadYouTubeAPI() {
  if (ytApiLoaded) return;
  ytApiLoaded = true;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

window.onYouTubeIframeAPIReady = function() {
  ytApiReady = true;
  if (ytPending) {
    createYtPlayer(ytPending.id, ytPending.title);
    ytPending = null;
  }
};

function startYoutube(videoId, title) {
  currentMode = 'youtube';
  vid.style.display = 'none';
  document.getElementById('yt-wrap').style.display = 'block';
  playerScreen.classList.add('player-screen--youtube');
  document.getElementById('overlay-title').textContent = 'YouTube';
  showPlayer();
  userPaused = false;

  if (ytPlayer) {
    ytPlayer.destroy();
    ytPlayer = null;
  }
  // Clear previous iframe
  document.getElementById('yt-wrap').innerHTML = '';

  if (ytApiReady) {
    createYtPlayer(videoId, title);
  } else {
    ytPending = { id: videoId, title };
    loadYouTubeAPI();
  }
}

function createYtPlayer(videoId, title) {
  const container = document.getElementById('yt-wrap');
  const div = document.createElement('div');
  div.id = 'yt-player-el';
  container.appendChild(div);

  document.getElementById('overlay-title').textContent = title || 'YouTube';

  ytPlayer = new YT.Player('yt-player-el', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1,
      playsinline: 1,
      rel: 0,
      modestbranding: 1,
    },
    events: {
      onReady: e => {
        e.target.playVideo();
        tryFullscreen();
      },
      onStateChange: e => {
        // YT.PlayerState.PAUSED = 2
        if (e.data === 2 && !userPaused && currentMode === 'youtube') {
          setTimeout(() => {
            if (!userPaused && ytPlayer && ytPlayer.getPlayerState() === 2) {
              ytPlayer.playVideo();
            }
          }, 120);
        }
      },
      onError: () => showError('Erro ao carregar vídeo do YouTube'),
    },
  });
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showPlayer() {
  document.getElementById('home').style.display = 'none';
  playerScreen.style.display = 'block';
  showOverlay();
}

function goHome() {
  if (currentMode === 'youtube') {
    if (ytPlayer) { ytPlayer.destroy(); ytPlayer = null; }
    document.getElementById('yt-wrap').style.display = 'none';
    document.getElementById('yt-wrap').innerHTML = '';
    playerScreen.classList.remove('player-screen--youtube');
  } else {
    vid.pause();
    destroyHls();
    vid.src = '';
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  }
  vid.style.display = 'block';
  playerScreen.style.display = 'none';
  document.getElementById('home').style.display = 'flex';
  userPaused = false;
  currentMode = 'video';
  hideBadge();
}

function playUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  const ytId = extractYoutubeId(url);
  if (ytId) {
    startYoutube(ytId, 'YouTube');
  } else {
    startVideo(url, url.split('/').pop().split('?')[0] || 'Stream');
  }
}

function playFile(input) {
  const file = input.files[0];
  if (!file) return;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  startVideo(objectUrl, file.name);
}

function startVideo(src, title) {
  currentMode = 'video';
  vid.style.display = 'block';
  document.getElementById('yt-wrap').style.display = 'none';
  playerScreen.classList.remove('player-screen--youtube');
  document.getElementById('overlay-title').textContent = title;
  showPlayer();
  userPaused = false;
  destroyHls();
  if (isHlsUrl(src)) {
    attachHls(src);
  } else {
    vid.src = src;
    vid.play().catch(() => {});
  }
}

// ── HTML5 Auto-resume ──────────────────────────────────────────────────────
let autoResumeCount = 0;
let lastAutoResume = 0;

vid.addEventListener('pause', () => {
  if (currentMode !== 'video') return;
  if (userPaused || vid.ended) return;

  const now = Date.now();
  if (now - lastAutoResume < 1500) { autoResumeCount++; } else { autoResumeCount = 1; }
  lastAutoResume = now;

  if (autoResumeCount >= 4) { showBadge(); return; }

  setTimeout(() => {
    if (!userPaused && !vid.ended && currentMode === 'video') {
      vid.play().catch(() => showBadge());
    }
  }, 120);
});

vid.addEventListener('play', () => {
  hideBadge();
  autoResumeCount = 0;
  updatePlayBtn(true);
});

vid.addEventListener('pause', () => updatePlayBtn(false));
vid.addEventListener('ended', () => updatePlayBtn(false));

function showBadge() {
  if (resumeBadgeShown) return;
  resumeBadgeShown = true;
  document.getElementById('resume-badge').style.display = 'block';
  showOverlay();
}

function hideBadge() {
  resumeBadgeShown = false;
  document.getElementById('resume-badge').style.display = 'none';
}

function manualResume() {
  userPaused = false;
  hideBadge();
  if (currentMode === 'youtube' && ytPlayer) ytPlayer.playVideo();
  else vid.play();
}

// ── Controls ───────────────────────────────────────────────────────────────
function togglePlay() {
  if (currentMode === 'youtube' && ytPlayer) {
    if (ytPlayer.getPlayerState() === 1) { userPaused = true; ytPlayer.pauseVideo(); }
    else { userPaused = false; ytPlayer.playVideo(); }
    return;
  }
  if (vid.paused) { userPaused = false; vid.play(); }
  else { userPaused = true; vid.pause(); }
}

function skipBack(e) {
  if (e && e.target !== document.getElementById('tap-back')) return;
  if (currentMode === 'youtube' && ytPlayer) {
    ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
  } else {
    vid.currentTime = Math.max(0, vid.currentTime - 10);
  }
  flashSkip('−10s');
}

function skipFwd(e) {
  if (e && e.target !== document.getElementById('tap-fwd')) return;
  if (currentMode === 'youtube' && ytPlayer) {
    ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
  } else {
    vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
  }
  flashSkip('+10s');
}

function toggleMute() {
  vid.muted = !vid.muted;
  document.getElementById('volIcon').style.opacity = vid.muted ? '0.35' : '1';
}

function setVolume(v) {
  vid.volume = v;
  vid.muted = (v == 0);
}

function updatePlayBtn(playing) {
  document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
  document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
}

// ── Progress bar ───────────────────────────────────────────────────────────
vid.addEventListener('timeupdate', updateProgress);
vid.addEventListener('loadedmetadata', updateProgress);

function updateProgress() {
  if (seeking) return;
  const pct = vid.duration ? (vid.currentTime / vid.duration) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-thumb').style.left = pct + '%';
  document.getElementById('timeDisplay').textContent =
    fmt(vid.currentTime) + ' / ' + fmt(vid.duration || 0);
}

function fmt(s) {
  if (!isFinite(s)) return '–:––';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

const pw = document.getElementById('progress-wrap');

function seekFromEvent(e) {
  const rect = pw.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  vid.currentTime = pct * (vid.duration || 0);
  document.getElementById('progress-fill').style.width = (pct * 100) + '%';
  document.getElementById('progress-thumb').style.left = (pct * 100) + '%';
}

pw.addEventListener('pointerdown', e => { seeking = true; e.preventDefault(); pw.setPointerCapture(e.pointerId); seekFromEvent(e); });
pw.addEventListener('pointermove', e => { if (seeking) seekFromEvent(e); });
pw.addEventListener('pointerup', () => { seeking = false; });

// ── Overlay ────────────────────────────────────────────────────────────────
function showOverlay() {
  clearTimeout(overlayTimer);
  document.getElementById('overlay').classList.add('visible');
  overlayTimer = setTimeout(hideOverlay, 4000);
}

function hideOverlay() {
  document.getElementById('overlay').classList.remove('visible');
}

document.getElementById('overlay').addEventListener('pointerdown', showOverlay);
playerScreen.addEventListener('pointerdown', e => {
  const overlay = document.getElementById('overlay');
  if (!overlay.classList.contains('visible')) {
    e.stopPropagation();
    showOverlay();
  }
});

// ── Fullscreen ─────────────────────────────────────────────────────────────
function tryFullscreen() {
  const el = playerScreen;
  if (!document.fullscreenElement) {
    try { (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el); } catch(e) {}
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) tryFullscreen();
  else (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
}

vid.addEventListener('play', tryFullscreen);

// ── Flash skip hint ────────────────────────────────────────────────────────
let flashEl = null;
function flashSkip(msg) {
  if (!flashEl) {
    flashEl = document.createElement('div');
    flashEl.style.cssText = `
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.65);color:#fff;font-size:1.3rem;font-weight:600;
      padding:12px 24px;border-radius:10px;pointer-events:none;
      transition:opacity 0.4s;z-index:100;`;
    playerScreen.appendChild(flashEl);
  }
  flashEl.textContent = msg;
  flashEl.style.opacity = '1';
  clearTimeout(flashEl._t);
  flashEl._t = setTimeout(() => { flashEl.style.opacity = '0'; }, 700);
}

// ── Error message ──────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ── URL param autoplay ─────────────────────────────────────────────────────
(function() {
  const p = new URLSearchParams(location.search);
  const src = p.get('src');
  if (!src) return;
  const decoded = decodeURIComponent(src);
  const ytId = extractYoutubeId(decoded);
  if (ytId) startYoutube(ytId, 'YouTube');
  else startVideo(decoded, decoded.split('/').pop().split('?')[0] || 'Vídeo');
})();
</script>
